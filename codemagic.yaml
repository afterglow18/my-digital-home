# ─────────────────────────────────────────────────────────────────────────────
# Codemagic CI/CD — My Digital Home iOS build
# ─────────────────────────────────────────────────────────────────────────────
#
# REQUIRED — Codemagic → your app → Environment variables
# Group "signing":
#   APP_STORE_CONNECT_KEY_IDENTIFIER   FNNDY69F2J
#   APP_STORE_CONNECT_ISSUER_ID        66d4ce13-148d-4d6b-bab8-f1d0d8441a1e
#   APP_STORE_CONNECT_PRIVATE_KEY      Full .p8 file contents (mark Secure)
#
# Group "build_env":
#   VITE_API_BASE_URL                  Your deployed API URL

workflows:
  ios-app-store:
    name: iOS App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mydigitalhome.app
      xcode: latest
      node: 22
      groups:
        - signing
      vars:
        XCODE_SCHEME: App
        XCODE_PROJECT: artifacts/outfit-generator/ios/App/App.xcodeproj
        XCODE_WORKSPACE: artifacts/outfit-generator/ios/App/App.xcodeproj/project.xcworkspace
        COREPACK_ENABLE_STRICT: "0"
        BUNDLE_ID: com.mydigitalhome.app
        TEAM_ID: 2A78MFVCJS
        PROFILE_NAME: My Digital Home App

    scripts:
      - name: Install pnpm and dependencies
        script: |
          corepack disable || true
          npm install -g pnpm@9 --force
          pnpm install --no-frozen-lockfile

      - name: Build web assets
        script: |
          cd artifacts/outfit-generator
          pnpm vite build --config vite.capacitor.config.ts

      - name: Capacitor add iOS and sync
        script: |
          cd artifacts/outfit-generator
          rm -rf ios
          npx cap add ios
          npx cap sync ios

      - name: Inject Info.plist permission strings and export compliance
        script: |
          PLIST="artifacts/outfit-generator/ios/App/App/Info.plist"

          # Export compliance
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" || \
          /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"

          # Camera — required by @capacitor/camera (ITMS-90683 if missing)
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'My Digital Home uses your camera so you can photograph and add items to your home collection.'" "$PLIST" || \
          /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription 'My Digital Home uses your camera so you can photograph and add items to your home collection.'" "$PLIST"

          # Photo library read — required by @capacitor/camera (ITMS-90683 if missing)
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'My Digital Home reads your photo library so you can add existing photos to your home collection.'" "$PLIST" || \
          /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription 'My Digital Home reads your photo library so you can add existing photos to your home collection.'" "$PLIST"

          # Photo library write — required when saving captured photos
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string 'My Digital Home saves photos you take to your photo library.'" "$PLIST" || \
          /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryAddUsageDescription 'My Digital Home saves photos you take to your photo library.'" "$PLIST"

          echo "Info.plist keys set:"
          /usr/libexec/PlistBuddy -c "Print :ITSAppUsesNonExemptEncryption" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSPhotoLibraryUsageDescription" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSPhotoLibraryAddUsageDescription" "$PLIST"

      - name: Inject Vision plugin
        script: |
          # Copy native plugin source files into iOS App target
          cp artifacts/outfit-generator/ios-native/VisionPlugin.swift \
             artifacts/outfit-generator/ios/App/App/VisionPlugin.swift
          cp artifacts/outfit-generator/ios-native/VisionPlugin.m \
             artifacts/outfit-generator/ios/App/App/VisionPlugin.m

          # Register the files in the Xcode project (xcodeproj gem ships with CocoaPods on Codemagic)
          gem list xcodeproj | grep -q xcodeproj || gem install xcodeproj --no-document
          ruby artifacts/outfit-generator/ios-native/add_to_xcode.rb

      - name: Inject app icon
        script: |
          ICONSET="artifacts/outfit-generator/ios/App/App/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ICONSET"
          sips -z 1024 1024 app-store/AppIcon-1024.png --out "$ICONSET/AppIcon-1024.png"
          cat > "$ICONSET/Contents.json" << 'EOF'
          {
            "images": [
              {
                "filename": "AppIcon-1024.png",
                "idiom": "universal",
                "platform": "ios",
                "size": "1024x1024"
              }
            ],
            "info": {
              "author": "xcode",
              "version": 1
            }
          }
          EOF

      - name: Share App scheme
        script: |
          SCHEMES_DIR="$XCODE_PROJECT/xcshareddata/xcschemes"
          mkdir -p "$SCHEMES_DIR"
          # If Capacitor created a shared scheme already, leave it; otherwise copy from userdata
          if [ ! -f "$SCHEMES_DIR/App.xcscheme" ]; then
            USER_SCHEME=$(find "$XCODE_PROJECT/xcuserdata" -name "App.xcscheme" 2>/dev/null | head -1)
            if [ -n "$USER_SCHEME" ]; then
              cp "$USER_SCHEME" "$SCHEMES_DIR/App.xcscheme"
            fi
          fi
          echo "Shared schemes:"
          ls -la "$SCHEMES_DIR"
          echo "Available targets/schemes:"
          xcodebuild -list -project "$XCODE_PROJECT"

      - name: Set build number
        script: |
          cd artifacts/outfit-generator/ios/App
          agvtool new-version -all $BUILD_NUMBER

      - name: Re-apply provisioning profiles after cap sync
        script: |
          xcode-project use-profiles \
            --project artifacts/outfit-generator/ios/App/App.xcodeproj

      - name: Resolve Swift Package dependencies
        script: |
          cd artifacts/outfit-generator/ios/App
          xcodebuild \
            -resolvePackageDependencies \
            -workspace App.xcodeproj/project.xcworkspace \
            -scheme App

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "artifacts/outfit-generator/ios/App/App.xcodeproj/project.xcworkspace" \
            --scheme "$XCODE_SCHEME"

      - name: Upload to TestFlight
        script: |
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > /tmp/AuthKey.p8
          app-store-connect publish \
            --path $(find $CM_BUILD_DIR/build/ios/ipa -name "*.ipa" | head -1) \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --private-key "@file:/tmp/AuthKey.p8" \
            --testflight

    artifacts:
      - $CM_BUILD_DIR/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
